[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
markers =
    redis_integration: requires a real Redis instance and RUN_REDIS_INTEGRATION=1
addopts =
    --strict-markers
    --cov=cache
    --cov=config
    --cov=crud
    --cov=models
    --cov=routers
    --cov=schemas
    --cov=utils
    --cov-report=term-missing
    --cov-fail-under=70

