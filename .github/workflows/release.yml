name: Build Windows demo release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  backend-test:
    name: Backend quality gate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite://
      SQL_ECHO: "false"
      DEBUG_MODE: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install backend test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run backend tests and coverage gate
        run: python -m pytest

  frontend-test:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xwzx-news
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: xwzx-news/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests and coverage gate
        run: npm run test:coverage
      - name: Verify demo frontend build
        run: npm run build:demo

  package:
    name: Package and publish Windows demo
    needs: [backend-test, frontend-test]
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-release.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: xwzx-news/package-lock.json
      - name: Install release dependencies
        run: python -m pip install -r requirements-release.txt
      - name: Install frontend dependencies
        working-directory: xwzx-news
        run: npm ci
      - name: Build Windows demo ZIP
        shell: pwsh
        run: .\scripts\build_windows_demo.ps1
      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $env:DEMO_PORT = "8765"
          $env:DEMO_OPEN_BROWSER = "false"
          $demoDirectory = (Resolve-Path ".\demo-dist\FastApiVueNews").Path
          $stdoutPath = Join-Path $env:RUNNER_TEMP "demo-stdout.log"
          $stderrPath = Join-Path $env:RUNNER_TEMP "demo-stderr.log"
          $process = Start-Process `
            -FilePath (Join-Path $demoDirectory "FastApiVueNews.exe") `
            -WorkingDirectory $demoDirectory `
            -WindowStyle Hidden `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath `
            -PassThru
          $ready = $false
          try {
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              Start-Sleep -Milliseconds 500
              if ($process.HasExited) { break }
              try {
                $response = Invoke-WebRequest "http://127.0.0.1:8765/" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content -match '<div id="app">') {
                  $ready = $true
                  break
                }
              }
              catch {}
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
          if (-not $ready) {
            Get-Content $stdoutPath -ErrorAction SilentlyContinue
            Get-Content $stderrPath -ErrorAction SilentlyContinue
            throw "Packaged executable did not become ready"
          }
      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $asset = ".\demo-dist\FastApiVueNews-Windows-x64.zip"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber
          }
          else {
            gh release create $tag $asset --title "FastAPI Vue News $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
