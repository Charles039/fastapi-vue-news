name: Automated tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite://
      SQL_ECHO: "false"
      DEBUG_MODE: "false"
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run backend tests and coverage gate
        run: python -m pytest

  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xwzx-news
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: xwzx-news/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests and coverage gate
        run: npm run test:coverage
      - name: Build frontend
        run: npm run build

